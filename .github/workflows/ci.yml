name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only needs to read the checked-out tree.
permissions:
  contents: read

# Supersede in-flight runs for the same ref so a force-push doesn't pile up
# redundant jobs. `github.head_ref` is set on PRs, `github.ref` on branch
# pushes; never cancel runs on the default branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --all-features

  # Emit a machine-readable line-coverage % for the dashboard. Additive and
  # non-gating: there is no --fail-under threshold, so coverage never blocks a
  # merge. Uses cargo-llvm-cov (LLVM source-based coverage).
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run coverage
        run: |
          cargo llvm-cov --locked --all-features --summary-only --json --output-path coverage.json
          cargo llvm-cov --locked --all-features --summary-only
      - name: Write coverage summary
        run: |
          PCT=$(jq -r '.data[0].totals.lines.percent' coverage.json)
          printf '### Line coverage: %.2f%%\n' "$PCT" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.json

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --locked --no-deps --all-features

  # NOTE: this job only checks the spec PIN (does the pinned tag exist as a real
  # release, and does it lag the latest?). It does NOT verify endpoints.txt or the
  # SDK against the spec — that is the `spec-drift` job in spec-drift.yml.
  #
  # Named `spec-pin`, not `drift` (ENG-7961). It was `drift` until this commit,
  # which was actively misleading: `spec-drift` is the job that verifies the
  # manifest, and a reviewer reading a green `drift` reasonably assumed that had
  # happened. Renaming a REQUIRED context needs the branch-protection setting
  # updated in the same change — see the footer of spec-drift.yml.
  spec-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check pinned API spec version against latest release
        env:
          # The spec lives in a separate repo. GITHUB_TOKEN works when that repo
          # is public or in the same org with read access; otherwise set a
          # SPEC_REPO_TOKEN secret (a PAT with read access to the spec repo).
          GH_TOKEN: ${{ secrets.SPEC_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          SPEC_REPO: nexus-xyz/nexus-exchange-api
        run: |
          set -euo pipefail

          pinned="$(tr -d '[:space:]' < .api-version)"
          if [ -z "$pinned" ]; then
            echo "::error file=.api-version::.api-version is empty"
            exit 1
          fi
          echo "Pinned API spec version: $pinned"

          api="https://api.github.com/repos/${SPEC_REPO}"

          # Real, breaking drift FAILS this check; a pin that merely lags the
          # latest release WARNS but passes. Rationale (EDR-002): the SDK
          # deliberately tracks the latest stable tag and may validly lag the
          # bleeding edge, so "a newer release exists" is informational, not a
          # build break. The complementary endpoints.txt<->spec invariant — an
          # operation that vanished from the pinned spec — is enforced separately
          # by scripts/check_spec_drift.py (the `spec-drift` job); that is where
          # real breakage against the *pinned* spec fails.

          # 1. The pinned version must exist as a published release in the spec
          #    repo. A pin that is not a real release tag is genuine breakage
          #    (typo, deleted/yanked release, or unreadable spec repo) and FAILS.
          pinned_status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${api}/releases/tags/${pinned}")"
          if [ "$pinned_status" != "200" ]; then
            echo "::error::Pinned spec version ${pinned} is not a published release in ${SPEC_REPO} (HTTP ${pinned_status}). Cannot verify spec; check the pin in .api-version and that CI can read the spec repo."
            exit 1
          fi

          # 2. Compare the pin to the latest published release. If the pin is
          #    simply behind, that is the SDK validly lagging — WARN, do not fail.
          latest="$(curl -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${api}/releases/latest" | jq -r '.tag_name // empty')"
          if [ -z "$latest" ]; then
            echo "::error::Could not determine latest release of ${SPEC_REPO}."
            exit 1
          fi
          echo "Latest API spec release:  $latest"

          if [ "$pinned" != "$latest" ]; then
            echo "::warning::SDK pins ${pinned} but the latest Exchange API spec is ${latest} (pinned ${pinned} vs latest ${latest}; the SDK is behind). This is advisory: the SDK deliberately tracks the latest stable tag and may lag the bleeding edge (EDR-002). Bump .api-version (and the README table) once the SDK is updated for ${latest}; the spec-autobump workflow will normally open that PR automatically."
            exit 0
          fi

          echo "Pin is current: SDK is pinned to the latest API spec (${pinned})."

  # Guard the floor declared by `rust-version` in Cargo.toml. Cargo.toml is the
  # single source of truth — the toolchain is read from it, never duplicated
  # here, so the two can't drift.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          version="$(grep -m1 -E '^rust-version[[:space:]]*=' Cargo.toml \
            | sed -E 's/.*"([0-9]+(\.[0-9]+){1,2})".*/\1/')"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "::error::could not parse rust-version from Cargo.toml (got '$version')"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MSRV is $version"
      # Third-party action pinned to a full commit SHA (not @master): an
      # unpinned ref is arbitrary CI code that a retag/compromise could swap.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --all-features

  semver:
    name: semver-breaking API changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # `baseline-rev` below diffs against the PR's merge base, so that
          # commit must be in history.
          fetch-depth: 0
      # Detect public-API breaking changes vs the PR's base (main), so each PR is
      # judged only on the delta IT introduces — not on breaks already merged but
      # not yet released (which is why this check used to be red on every PR).
      #
      # Policy: an intentional break is fine AS LONG AS it is DECLARED — a
      # conventional-commit `!` (e.g. `feat!:`) in the PR title, or a
      # `BREAKING CHANGE:` footer in the body — so release-plz computes the right
      # version bump. We fail ONLY on an *undeclared* break. For renames prefer a
      # #[deprecated] alias over removal. See CONTRIBUTING.md
      # ("Compatibility & deprecations").
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      # Install the CLI directly instead of the wrapper action so this job — not
      # the action — owns interpreting the result. The wrapper exposes no output
      # that separates "ran and found a break" from "the tool itself errored",
      # and its step `outcome` is `failure` in BOTH cases. cargo-semver-checks
      # exits nonzero for both, so the exit code alone can't tell them apart
      # either — we disambiguate on the tool's own structured report below.
      #
      # PIN THE VERSION (ENG-4136). The classify step below distinguishes a real
      # break from a tool/infra failure by matching the exact summary string
      # "semver requires new {major|minor} version". Leaving the tool unpinned
      # lets install-action pull the latest cargo-semver-checks, so a future
      # release that rewords that summary would make the classifier misread a
      # real break as an infra failure. It still fails closed (a real break
      # never silently passes — the job fails either way), but the error message
      # would be wrong. Pinning keeps the summary string stable; when bumping,
      # re-verify the summary text below still matches.
      #
      # THE PIN HAS A COST, and it came due on 2026-08-20 (ENG-11844): the
      # toolchain above is `stable`, unpinned, so rustdoc's JSON format moves
      # underneath a pinned tool that can only read the formats it shipped
      # knowing about. 0.48.0 could not read v60 and every PR failed with
      # `error: unsupported rustdoc format v60`. 0.50.0 reads v60 and v61.
      #
      # So this pin needs bumping roughly whenever rustdoc's format bumps — it is
      # maintenance, not set-and-forget. Verified when bumping to 0.50.0: the
      # summary string in the tool's src/check_release.rs is byte-identical to
      # 0.48.0's, so the classifier below is unaffected.
      #
      # WHEN BUMPING, RE-VERIFY THE SUMMARY STRING — and nothing else about the
      # classifier should need re-verifying, which is the point. The 0.50.0 bump
      # checked exactly that and was still incomplete, because the classify step
      # ALSO keyed on the exit code, and 0.50.0 moved a detected break from exit 1
      # to exit 100 (`LINT_FAILURE_EXIT_CODE`). Every breaking-change PR failed as
      # a phantom infra error until that was found. The classifier no longer looks
      # at the exit code at all — see the long note in the classify step — so the
      # summary string is now the whole contract with this tool. Keep it that way.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@0.50.0
      # Run the check, capturing combined output and exit code without aborting
      # the step (we classify the result ourselves in the next step).
      - id: semver
        run: |
          set +e
          cargo semver-checks \
            --baseline-rev "${{ github.event.pull_request.base.sha || 'HEAD~1' }}" \
            2>&1 | tee semver-output.txt
          # Capture the CLI's exit code, not tee's.
          code="${PIPESTATUS[0]}"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "cargo-semver-checks exited with $code"
      - name: Classify result and require breaking changes to be declared
        if: github.event_name == 'pull_request'
        env:
          EXIT_CODE: ${{ steps.semver.outputs.exit_code }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          # Exit 0: the tool ran and found no breaking change. Done.
          if [ "$EXIT_CODE" = "0" ]; then
            echo "✅ No breaking public-API change vs base."
            exit 0
          fi

          # A nonzero exit means BOTH a detected break AND the tool's own internal
          # errors (bad baseline rev, build failure, panic, network). Distinguish
          # them on the tool's structured report, NOT on the exit code: a genuine
          # break prints the summary
          #   "semver requires new {major|minor} version: N major and M minor checks failed"
          # (stable for the version pinned in the install step above — ENG-4136)
          # whereas an infra/tool error aborts with an `error: …` line and never
          # emits that summary. No summary => tool/infra failure — fail loudly and
          # distinctly so it is NOT misread as an undeclared break (and vice versa).
          #
          # DO NOT re-add an exit-code equality test here. This condition used to
          # read `[ "$EXIT_CODE" != "1" ] || ! grep -q <summary>`, because a break
          # exited 1 up to and including 0.48.0. It does not any more: 0.50.0
          # exits 100 for deny-level lint failures (`LINT_FAILURE_EXIT_CODE`) and
          # 101 for a tool error, so the 0.48.0 -> 0.50.0 pin bump (ENG-11844,
          # made for `unsupported rustdoc format v60`) silently inverted this
          # branch. Every breaking-change PR then failed as a phantom "infra
          # failure", with the `!` / BREAKING CHANGE declaration never consulted —
          # fail-closed, but a correctly-declared break became unmergeable and the
          # error sent you chasing a baseline problem that did not exist. It sat
          # latent until the first PR that actually broke the API tripped it.
          #
          # That bump verified the SUMMARY STRING was byte-identical across
          # versions but not the exit code, though the condition keyed on both.
          # The summary is the signal the tool documents and the one that survived;
          # the exit code is an implementation detail that moved without a note.
          # So classify on the summary alone, and keep the exit code for the
          # message only.
          if ! grep -Eq 'semver requires new (major|minor) version' semver-output.txt; then
            # Name the one tooling failure that is neither transient nor a
            # baseline problem, because the generic advice below ("re-run",
            # "check the baseline") is actively wrong for it: rustdoc's JSON
            # format moved and the PINNED tool above cannot read the new one.
            # Re-running never helps; the baseline was never broken. This cost
            # real debugging time once (ENG-11844) — the point of the check is
            # to tell you what happened, so it should say so.
            if grep -q 'unsupported rustdoc format' semver-output.txt; then
              fmt="$(grep -o 'unsupported rustdoc format v[0-9]*' semver-output.txt | head -1)"
              echo "::error::cargo-semver-checks cannot read this toolchain's rustdoc JSON (${fmt:-unknown format}). This is NOT a breaking change and NOT transient — the tool is pinned in the install step above and Rust stable has moved past it. Bump the pin to a cargo-semver-checks release that supports this format, and re-verify the summary string this step greps for (see ENG-11844)."
              exit 1
            fi
            echo "::error::cargo-semver-checks did not run successfully (exit ${EXIT_CODE}); this is a tooling/infra failure, not a detected breaking change. Re-run; if it persists, investigate the baseline fetch / build."
            exit 1
          fi

          # A real break was detected — require it to be declared so release-plz
          # computes the right version bump.
          # Conventional-commit `!` before the colon: feat!:, fix(scope)!:, …
          # Match the type prefix case-insensitively so 'Feat!:'/'Fix!:' count too.
          if printf '%s' "$PR_TITLE" | grep -iqE '^[a-z]+(\([^)]*\))?!:' \
            || printf '%s\n' "$PR_BODY" | grep -q 'BREAKING CHANGE:'; then
            echo "✅ Breaking API change detected AND declared (\`!\` / BREAKING CHANGE)."
            echo "   release-plz will bump the version accordingly."
            exit 0
          fi
          echo "::error::Breaking public-API change detected but NOT declared."
          echo "Mark the PR title as a breaking change (e.g. 'feat!: …') or add a"
          echo "'BREAKING CHANGE:' footer so release-plz bumps the version — or keep"
          echo "compatibility with a #[deprecated] alias instead of removing/renaming."
          exit 1
