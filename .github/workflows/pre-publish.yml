name: Pre-publish

# The checks between a release PR and crates.io (ENG-18798). A crates.io version can't be taken
# back, so publishing stays a person merging the release PR; these make sure what they merge is not
# broken. Three jobs, with the same names in every SDK repo, so one required-checks setting covers
# the fleet:
#
#   prepublish-surface  the packed crate's public API equals the committed public-api.txt
#   prepublish-smoke    the packed crate, built into a clean consumer, reads the public testnet
#   prepublish-verdict  the version the release PR proposes fits the spec change since the last
#                       publish, graded by the monorepo's classifier (scripts/release_gate/VENDORED.md)
#
# The drift checks are the fourth leg and are not repeated here: `spec-drift` (spec-drift.yml,
# enum members included) and `spec-pin` (ci.yml) already run on every PR, the release PR among them,
# and are already required.
#
# RUNS ON EVERY PR, with no `paths:` filter, for spec-drift.yml's reason: a required check that is
# skipped reports nothing, and the PR waits on it forever. What changes on a release PR (head branch
# `release-plz-*`), or on a PR that edits this gate:
#   * smoke makes the testnet read. Elsewhere it packs and builds a consumer only, and says so.
#   * verdict is enforced on a release PR. Elsewhere it reports what the next release will need.
# The surface check is enforced on every PR, because the PR that changes the API is where the
# snapshot has to move.
#
# The release PR's runs need one click today. release-plz opens it with GITHUB_TOKEN, and this
# repo's approval policy parks those runs in `action_required` until someone clicks "Approve and
# run workflows" on the PR. Until then the PR shows no checks, so it can't merge either way.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pre-publish-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # Pinned together; see the header of scripts/release_gate/public_api.sh before bumping either.
  PUBLIC_API_NIGHTLY: nightly-2026-10-01
  CARGO_PUBLIC_API_VERSION: 0.52.0
  # The version classify_spec_change.py requires (its OASDIFF_VERSION), by checksum, as the
  # monorepo installs it.
  OASDIFF_VERSION: 1.30.0
  OASDIFF_SHA256: bfa353e7c699dd201d52dd42839330a0d4ba0429767c8ec9fc0e5fdc650b8060

jobs:
  prepublish-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: ${{ env.PUBLIC_API_NIGHTLY }}
      - uses: Swatinem/rust-cache@v2
      - name: Cache cargo-public-api
        id: cpa-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-public-api
          key: cargo-public-api-${{ env.CARGO_PUBLIC_API_VERSION }}-${{ runner.os }}
      - name: Install cargo-public-api
        if: steps.cpa-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-public-api --version "$CARGO_PUBLIC_API_VERSION" --locked
      - name: Public surface of the packed crate vs public-api.txt
        run: scripts/release_gate/public_api.sh

  prepublish-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Release PR, or a change to this gate?
        id: mode
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$HEAD_REF" == release-plz-* ]]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA" HEAD | grep -qE '^(\.github/workflows/pre-publish\.yml|scripts/release_gate/)'; then
            echo "mode=gate-change" >> "$GITHUB_OUTPUT"
          else
            echo "mode=other" >> "$GITHUB_OUTPUT"
          fi
      - name: Pack, build a clean consumer, read testnet
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          if [ "$MODE" = "other" ]; then
            scripts/release_gate/smoke.sh --build-only
          else
            scripts/release_gate/smoke.sh
          fi

  prepublish-verdict:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # The release tags: the spec pin of the published version is read at `v<version>`.
          fetch-depth: 0
          persist-credentials: false
      - name: Install oasdiff ${{ env.OASDIFF_VERSION }}
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" \
            -o "$RUNNER_TEMP/oasdiff.tar.gz"
          echo "${OASDIFF_SHA256}  $RUNNER_TEMP/oasdiff.tar.gz" | sha256sum -c
          tar -xz -C "$RUNNER_TEMP" -f "$RUNNER_TEMP/oasdiff.tar.gz" oasdiff
          echo "OASDIFF=$RUNNER_TEMP/oasdiff" >> "$GITHUB_ENV"
      # The gate's own tests first, against the binary just installed: a broken gate fails as a
      # broken gate, and a vendored file that drifted from the monorepo fails here.
      - name: Self-test the gate
        run: python3 scripts/release_gate/test_release_verdict.py
      - name: Version proposed vs the spec change since the last publish
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          args=(--registry crates.io --package nexus-exchange --manifest Cargo.toml)
          if [[ "$HEAD_REF" != release-plz-* ]]; then
            args+=(--report)
          fi
          python3 scripts/release_gate/release_verdict.py "${args[@]}"
