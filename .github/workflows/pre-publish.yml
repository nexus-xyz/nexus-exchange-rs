name: Pre-publish

# The checks between a release PR and crates.io (ENG-18798). A crates.io version can't be taken
# back, so publishing stays a person merging the release PR; these make sure what they merge is not
# broken. Three jobs, with the same names in every SDK repo, so one required-checks setting covers
# the fleet:
#
#   prepublish-surface  the packed crate's public API equals the committed public-api.txt
#   prepublish-smoke    the packed crate, built into a clean consumer, reads the public testnet
#   prepublish-verdict  the version the release PR proposes fits the spec change since the last
#                       publish, graded by the monorepo's classifier (scripts/release_gate/VENDORED.md)
#
# The drift checks are the fourth leg and are not repeated here: `spec-drift` (spec-drift.yml,
# enum members included) and `spec-pin` (ci.yml) already run on every PR, the release PR among them,
# and are already required.
#
# RUNS ON EVERY PR, with no `paths:` filter, for spec-drift.yml's reason: a required check that is
# skipped reports nothing, and the PR waits on it forever. What changes on a release PR (head branch
# `release-plz-*`), or on a PR that edits this gate:
#   * smoke makes the testnet read. Elsewhere it packs and builds a consumer only, and says so.
#     Either way, smoke.sh first runs the built consumer against nothing and against a local stub
#     answering 503 (both must exit 2, unreachable), and against a local stub that has no markets
#     (must exit 1, failed), so exits 2 and 1 are exercised on every PR. Exit 0 (passed) is
#     exercised only by the testnet read itself. See the header of smoke.sh.
#   * verdict is enforced on a release PR. Elsewhere it reports what the next release will need.
# The surface check is enforced on every PR, because the PR that changes the API is where the
# snapshot has to move.
#
# The release PR's runs should start on their own: release-plz opens it as the nexus-release-bot2
# App (ENG-22238). The App's first release PR here may still park in `action_required`, before it
# has a merged commit; then someone clicks "Approve and run workflows" on the PR once.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pre-publish-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # Pinned together; see the header of scripts/release_gate/public_api.sh before bumping either.
  PUBLIC_API_NIGHTLY: nightly-2026-10-01
  CARGO_PUBLIC_API_VERSION: 0.52.0
  # The version classify_spec_change.py requires (its OASDIFF_VERSION), by checksum, as the
  # monorepo installs it.
  OASDIFF_VERSION: 1.30.0
  OASDIFF_SHA256: bfa353e7c699dd201d52dd42839330a0d4ba0429767c8ec9fc0e5fdc650b8060

jobs:
  prepublish-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: ${{ env.PUBLIC_API_NIGHTLY }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Restored from the copy cargo-public-api-cache.yml writes from main (a cache saved on a PR's
      # ref is that PR's alone). Its path and key must stay the same as there.
      - name: Cache cargo-public-api
        id: cpa-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-public-api
          key: cargo-public-api-${{ env.CARGO_PUBLIC_API_VERSION }}-${{ runner.os }}
      - name: Install cargo-public-api
        if: steps.cpa-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-public-api --version "$CARGO_PUBLIC_API_VERSION" --locked
      - name: Public surface of the packed crate vs public-api.txt
        run: scripts/release_gate/public_api.sh

  prepublish-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Release PR, or a change to this gate?
        id: mode
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          # HEAD is the PR's merge commit (actions/checkout's default on pull_request), and its first
          # parent is the base it was merged onto, so this lists the PR's own changes. Diffing from the
          # event's base.sha also listed whatever landed on the base since, which flipped unrelated PRs
          # into the testnet read.
          # Failing here is deliberate (ENG-21487): a PR with conflicts can't merge anyway, and
          # guessing its changes from base.sha is what this step replaced.
          if ! git rev-parse --verify --quiet 'HEAD^2' > /dev/null; then
            echo "::error title=prepublish-smoke::HEAD is not a merge commit, so the PR's own changes can't be listed. Either the PR has merge conflicts with its base (GitHub makes no merge commit for it: resolve them and the checks run again), or the checkout is shallow (this job needs fetch-depth: 0)"
            exit 1
          fi
          # Into a file, not a pipe: under pipefail a failed `git diff`, or one cut short by
          # `grep -q` (SIGPIPE), would read as "not a gate change" and skip the read quietly.
          git diff --name-only 'HEAD^1' HEAD > "$RUNNER_TEMP/changed.txt"
          if [[ "$HEAD_REF" == release-plz-* ]]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
          elif grep -qE '^(\.github/workflows/pre-publish\.yml|scripts/release_gate/)' "$RUNNER_TEMP/changed.txt"; then
            echo "mode=gate-change" >> "$GITHUB_OUTPUT"
          else
            echo "mode=other" >> "$GITHUB_OUTPUT"
          fi
      - name: Pack, build a clean consumer, read testnet
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          if [ "$MODE" = "other" ]; then
            scripts/release_gate/smoke.sh --build-only
          else
            scripts/release_gate/smoke.sh
          fi

  prepublish-verdict:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release tags: the spec pin of the published version is read at `v<version>`.
          fetch-depth: 0
          persist-credentials: false
      - name: Install oasdiff ${{ env.OASDIFF_VERSION }}
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" \
            -o "$RUNNER_TEMP/oasdiff.tar.gz"
          echo "${OASDIFF_SHA256}  $RUNNER_TEMP/oasdiff.tar.gz" | sha256sum -c
          tar -xz -C "$RUNNER_TEMP" -f "$RUNNER_TEMP/oasdiff.tar.gz" oasdiff
          echo "OASDIFF=$RUNNER_TEMP/oasdiff" >> "$GITHUB_ENV"
      # The gate's own tests first, against the binary just installed: a broken gate fails as a
      # broken gate, and a vendored file edited in this repo fails here, because its sha256 no
      # longer matches the one recorded in release_verdict.py. A change to the monorepo's copy is
      # not seen from here: VENDORED.md says how to refresh.
      - name: Self-test the gate
        env:
          # The end-to-end tests fail instead of skipping if oasdiff is missing, so this step can't
          # go green without running the classifier.
          RELEASE_GATE_REQUIRE_OASDIFF: "1"
        run: python3 scripts/release_gate/test_release_verdict.py
      - name: Version proposed vs the spec change since the last publish
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          # --surface-file '': the public-API grade against the published tag is off here.
          # release-plz picks this crate's version with cargo-semver-checks (semver_check in
          # release-plz.toml), and public-api.txt renders dependency paths that move with no
          # change for users, which that grade would read as removals.
          args=(--registry crates.io --package nexus-exchange --manifest Cargo.toml --surface-file '')
          if [[ "$HEAD_REF" != release-plz-* ]]; then
            args+=(--report)
          fi
          python3 scripts/release_gate/release_verdict.py "${args[@]}"
