name: Release-plz

on:
  push:
    branches: [main]

# Each job opts into what it needs.
permissions: {}

# Two jobs, as in release-plz's quickstart (release-plz.dev/docs/github/quickstart, "Concurrency"):
# the release-PR job is serialised per branch, the publishing job is not. A concurrency group keeps
# only ONE pending run, so a third push while a run is in progress cancels the second push's
# pending run. With `release_always = false` (release-plz.toml) only the release PR's merge
# publishes, so if that merge were the cancelled one nothing would publish, and the run would show
# Cancelled, not failed (ENG-18798 review).
jobs:
  # Publishes what a merged release PR proposed. No concurrency group, on purpose (above).
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    permissions:
      contents: write # tags and the GitHub release
      pull-requests: read # is this push a release PR's merge? (release-plz asks too)
      # crates.io trusted publishing (ENG-18798): lets the publish step trade this run's OIDC token
      # for a 30-minute crates.io token instead of using a long-lived one. See the steps below.
      id-token: write
    env:
      HAS_RELEASE_BOT: ${{ secrets.RELEASE_BOT_APP_ID != '' && secrets.RELEASE_BOT_PRIVATE_KEY != '' }}
    steps:
      # The App token release-plz runs as (nexus-release-bot2, as in -go, -cli and -mcp; ENG-22238).
      # Since 10-07 the org no longer lets GITHUB_TOKEN open PRs, and an App token is not subject to
      # that setting; its PRs also normally run CI without waiting for an "Approve and run workflows" click.
      # Falls back to GITHUB_TOKEN until the repo has both RELEASE_BOT_APP_ID and RELEASE_BOT_PRIVATE_KEY.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        if: env.HAS_RELEASE_BOT == 'true'
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          # No wider than this job's own grant.
          permission-contents: write
          permission-pull-requests: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The App token from the first step; GITHUB_TOKEN until the App secrets exist.
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          # Pinned by SHA, the action can't read the toolchain from its ref name.
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # release-plz publishes only when this push is a release PR's merge (`release_always = false`
      # in release-plz.toml). Ask the same question here, so a crates.io token is minted only for
      # the one push that can use it. A failed lookup (an API blip) must not stop the job: it only
      # skips the trusted-publishing attempt, so a publish falls back to CARGO_REGISTRY_TOKEN.
      # release-plz still decides on its own whether to publish.
      - name: Is this push a release PR's merge?
        id: release-merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! n="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '[.[] | select(.head.ref | startswith("release-plz-"))] | length')"; then
            echo "::warning title=release-merge lookup::Could not ask GitHub whether ${GITHUB_SHA} is a release PR's merge. Trusted publishing is skipped for this run; if release-plz publishes, it uses CARGO_REGISTRY_TOKEN."
            n=0
          fi
          # Anything but a count reads as "not a release merge" too, said here rather than left to
          # `[ -gt ]` erroring inside the `if` below (which happens to read as false).
          [[ "$n" =~ ^[0-9]+$ ]] || n=0
          if [ "$n" -gt 0 ]; then echo "merged=true" >> "$GITHUB_OUTPUT"; else echo "merged=false" >> "$GITHUB_OUTPUT"; fi
      # Trusted publishing first, the stored token second, so this keeps publishing both before and
      # after a crates.io owner adds the trusted publisher (owner nexus-xyz, repo nexus-exchange-rs,
      # workflow release-plz.yml, no environment). Until then the exchange fails, which
      # continue-on-error absorbs, and the publish falls back to CARGO_REGISTRY_TOKEN. Once the
      # publisher exists and that token is revoked and deleted, the fallback is empty, and a failed
      # exchange fails the publish loudly instead of silently using something else.
      #
      # Not release-plz's own trusted publishing: it only tries OIDC when no token is set at all
      # (release_plz_core release.rs, `should_use_trusted_publishing`), so it can't run alongside the
      # fallback. Once the stored token is gone, this step and the fallback can go, and release-plz
      # can mint the token itself.
      - name: crates.io token via trusted publishing
        id: crates-io
        if: steps.release-merge.outputs.merged == 'true'
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Say which credential publishes
        if: steps.release-merge.outputs.merged == 'true'
        env:
          HAS_OIDC_TOKEN: ${{ steps.crates-io.outputs.token != '' }}
        run: |
          if [ "$HAS_OIDC_TOKEN" = "true" ]; then
            echo "::notice title=crates.io credential::Publishing with a trusted-publishing token (OIDC)."
          else
            echo "::warning title=crates.io credential::Trusted publishing is not configured on crates.io for this repo yet; publishing with the long-lived CARGO_REGISTRY_TOKEN (ENG-18798)."
          fi
      - uses: MarcoIeni/release-plz-action@8921286633dfa0c4020f7f30bd1c14fe19cbb10e # v0.5.142
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}

  # Opens and refreshes the release PR. Serialised per branch so two runs never edit it at once. A
  # cancelled pending run here loses nothing: the next run refreshes the same PR from a newer main.
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    env:
      HAS_RELEASE_BOT: ${{ secrets.RELEASE_BOT_APP_ID != '' && secrets.RELEASE_BOT_PRIVATE_KEY != '' }}
    steps:
      # The App token release-plz runs as (nexus-release-bot2, as in -go, -cli and -mcp; ENG-22238).
      # Since 10-07 the org no longer lets GITHUB_TOKEN open PRs, and an App token is not subject to
      # that setting; its PRs also normally run CI without waiting for an "Approve and run workflows" click.
      # Falls back to GITHUB_TOKEN until the repo has both RELEASE_BOT_APP_ID and RELEASE_BOT_PRIVATE_KEY.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        if: env.HAS_RELEASE_BOT == 'true'
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          # No wider than this job's own grant.
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The App token from the first step, so release-plz's release PRs are
          # authored by the App and their checks start without a click.
          # GITHUB_TOKEN until the App secrets exist.
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          # Pinned by SHA, the action can't read the toolchain from its ref name.
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: MarcoIeni/release-plz-action@8921286633dfa0c4020f7f30bd1c14fe19cbb10e # v0.5.142
        with:
          command: release-pr
        env:
          # With the App token, release-plz's PRs are opened as the App and their
          # checks start on their own. The GITHUB_TOKEN fallback can no longer open
          # the PR at all since 10-07; before that, every run on its PRs parked in
          # `action_required` until someone clicked "Approve and run workflows"
          # (seen on #175: CI, Security and Spec drift at 2026-10-08T01:11Z).
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          # As in release-plz's quickstart. `release-pr` never publishes.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
