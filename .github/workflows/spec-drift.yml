name: Spec drift

# Verifies, against the pinned OpenAPI spec (.api-version): the endpoints the SDK
# targets (endpoints.txt) all still exist; the REST client code matches that
# list; a representative set of serde models (src/types.rs) read/write only
# fields the spec still defines; and a representative set of enums (src/types.rs
# serde enums + the WS `Channel` enum in src/ws/protocol.rs) model exactly the
# spec's member set. Reports spec operations not yet covered. Fetches the spec
# from the raw-at-tag URL (uncounted — the release asset download_count is
# reserved as an external adoption signal) and caches it by the pinned version
# so a normal run does no network.
#
# RUNS ON EVERY PR, DELIBERATELY — do not add a `paths:` filter (ENG-7961).
#
# "Safe to merge = spec-drift is green" is the whole merge signal for a spec
# pin-bump PR, and a path filter quietly makes that claim conditional:
#
#   * A skipped workflow reports NOTHING, so a required check that never runs is
#     satisfied by absence. This job's name is therefore also distinct from CI's
#     pin-lag job, now `spec-pin` (it only compares the pin to the api repo's
#     latest release and does NOT verify the manifest). While that job and this
#     one were BOTH called `drift`, a PR outside the old path filter showed a
#     green `drift` that had verified nothing — see the note at the bottom.
#   * The filter had to be maintained in lockstep with the files
#     check_spec_drift.py actually reads (src/rest.rs, src/types.rs,
#     src/ws/protocol.rs). Nothing enforced that, so moving a REST method into a
#     new module would have silently stopped triggering the check that exists to
#     notice exactly such a move.
#
# The run is cheap enough that filtering buys nothing: the pinned spec is cached
# by version, so a normal run does no network and finishes in seconds.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Named `spec-drift`, not `drift`: CI has its own pin-vs-latest job (`spec-pin`)
  # and two identically-named checks cannot be told apart by branch protection or
  # by a reviewer reading the checks list. Both were `drift` until ENG-7961.
  spec-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read pinned spec version
        id: pin
        run: |
          tag="$(cat .api-version)"
          # Validate before it reaches any URL / cache key: a crafted
          # .api-version on a fork PR could otherwise inject into the fetch.
          if [[ ! "$tag" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::.api-version must look like vX.Y.Z (got: '$tag')"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Cache the pinned spec
        id: cache
        uses: actions/cache@v6
        with:
          path: openapi.pinned.json
          key: spec-${{ steps.pin.outputs.tag }}

      - name: Fetch spec (cache miss only)
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          # Passed via env (not interpolated into the script) so the tag is
          # data, not code; validated to ^v[0-9.]+$ in the pin step above.
          SPEC_TAG: ${{ steps.pin.outputs.tag }}
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/nexus-xyz/nexus-exchange-api/${SPEC_TAG}/openapi.json" \
            -o openapi.pinned.json

      # Self-test the drift checker itself: proves the enum-member invariants
      # (ENG-5474) go red on a spec<->SDK delta before we trust a green run.
      - name: Self-test the drift checker
        run: python3 scripts/test_check_spec_drift.py

      - name: Check drift
        run: python3 scripts/check_spec_drift.py openapi.pinned.json

# REQUIRED-CHECK SETTING (ENG-7961)
#
# `spec-drift` IS a required context on `main` as of 2026-07-31 — the manifest
# verification the autobump's safety argument leans on is now enforced, not
# advisory. Required contexts, in full:
#
#   fmt  clippy  test  docs  spec-pin  spec-drift
#
# `spec-pin` is CI's pin-vs-latest job, renamed from `drift` in the same change
# that swapped the context (see the NOTE above that job in ci.yml). Two rules
# learned the hard way, worth keeping if you touch any of this:
#
#   1. RENAME AND SETTING MOVE TOGETHER. A required context with no job reporting
#      it blocks every PR — GitHub waits forever for a check that will never
#      arrive. Equally, a renamed job whose old context stays required blocks
#      every PR. There is no atomic way to do both, so expect the PR making the
#      rename to need an admin merge, and patch protection immediately after.
#   2. NEVER REQUIRE A CHECK THAT DOES NOT YET RUN ON `main`. A context is only
#      satisfiable once the workflow producing it is on the base branch.
#
# The endpoint REPLACES the whole list — it does not append. Every context is
# repeated deliberately; omitting one silently unprotects it, so do not trim this
# to just the entry you are adding:
#
#   gh api -X PATCH repos/nexus-xyz/nexus-exchange-rs/branches/main/protection/required_status_checks \
#     --input - <<'JSON'
#   {
#     "strict": false,
#     "checks": [
#       {"context": "fmt",        "app_id": 15368},
#       {"context": "clippy",     "app_id": 15368},
#       {"context": "test",       "app_id": 15368},
#       {"context": "docs",       "app_id": 15368},
#       {"context": "spec-pin",   "app_id": 15368},
#       {"context": "spec-drift", "app_id": 15368}
#     ]
#   }
#   JSON
#
# Values mirror the settings as of this commit (`strict: false`, app_id 15368 =
# GitHub Actions). This endpoint touches ONLY required_status_checks; the review
# rules, force-push and linear-history settings are unaffected. Re-read before
# running, in case the list has moved on:
#
#   gh api repos/nexus-xyz/nexus-exchange-rs/branches/main/protection/required_status_checks \
#     --jq '.strict, (.checks[] | .context)'
